version: '3.8'

# ============================================================
# 小说 Agent 工作台 - Docker Compose
# ============================================================
# 部署前请：
#   1. cp .env.example .env
#   2. 修改 .env 里的 CORS_ORIGINS 和 REACT_APP_API_URL
#      - 远程访问：填公网 IP 或域名
#      - 本机访问：保持 http://localhost:xxxx 即可
#   3. 重新生成 APP_API_KEY / APP_SECRET_KEY（见 .env.example 注释）
# ============================================================

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: novel-agent-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - UPLOAD_DIR=${UPLOAD_DIR:-/app/data/uploads}
      - ARTIFACTS_DIR=${ARTIFACTS_DIR:-/app/data/artifacts}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3005}
      - APP_SECRET_KEY=${APP_SECRET_KEY:-}
      - APP_API_KEY=${APP_API_KEY:-}
      - APP_ENV=${APP_ENV:-development}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: novel-agent-frontend
    ports:
      - "3005:3000"
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8000/api}
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    restart: unless-stopped

  # 可选：使用更强大的生产级数据库
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: novel-agent-db
  #   environment:
  #     POSTGRES_USER: novelagent
  #     POSTGRES_PASSWORD: novelagent123
  #     POSTGRES_DB: novel_agent
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"

volumes:
  postgres_data:
