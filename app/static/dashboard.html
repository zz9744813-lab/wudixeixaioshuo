<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novel Genome</title>
<script>
window._echartsReady = new Promise(res => {
  const s1 = document.createElement('script');
  s1.src = 'https://registry.npmmirror.com/echarts/5.5.1/files/dist/echarts.min.js';
  s1.onload = () => res(true);
  s1.onerror = () => { const s2 = document.createElement('script');
    s2.src = 'https://cdn.bootcdn.net/ajax/libs/echarts/5.5.1/echarts.min.js';
    s2.onload = () => res(true); s2.onerror = () => res(false);
    document.head.appendChild(s2); };
  document.head.appendChild(s1);
});
/* restore prefs before paint */
(function(){
  const th = localStorage.getItem('ng_theme') || 'dark';
  const lg = localStorage.getItem('ng_lang') || ((navigator.language||'').startsWith('ja') ? 'ja' : (navigator.language||'').startsWith('zh') ? 'zh' : 'en');
  document.documentElement.dataset.theme = th;
  document.documentElement.lang = lg === 'zh' ? 'zh-CN' : lg;
})();
</script>
<style>
/* ===== tokens ===== */
:root{
  --bg:#0E1014; --s1:#14161B; --s2:#191C23; --s3:#1F232C;
  --bd:rgba(255,255,255,.06); --bd2:rgba(255,255,255,.12);
  --t1:#EDEEF0; --t2:#9BA1AC; --t3:#616774;
  --acc:#8B8CF9; --acc-dim:rgba(139,140,249,.14); --acc-txt:#0E1014;
  --ok:#4CC38A; --warn:#E2B93B; --bad:#E5697A; --cy:#5AC8E8;
  --shadow:0 24px 70px rgba(0,0,0,.5);
  --r-s:8px; --r-m:10px; --r-l:12px;
  --mono:'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;
  --sans:'Inter','MiSans','HarmonyOS Sans SC','PingFang SC','Hiragino Sans','Yu Gothic UI','Segoe UI',system-ui,sans-serif;
}
:root[data-theme="light"]{
  --bg:#F6F6F7; --s1:#FFFFFF; --s2:#F0F0F2; --s3:#E9E9EC;
  --bd:rgba(15,18,25,.08); --bd2:rgba(15,18,25,.16);
  --t1:#17181C; --t2:#5B606B; --t3:#979DA8;
  --acc:#5D5EF0; --acc-dim:rgba(93,94,240,.09); --acc-txt:#FFFFFF;
  --ok:#1E9E62; --warn:#A87E14; --bad:#CE4257; --cy:#1E8FB8;
  --shadow:0 24px 60px rgba(30,35,60,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t1);font:400 13.5px/1.6 var(--sans);
  display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden;
  font-feature-settings:'tnum' on}
body.theming *, body.theming{transition:background-color .28s ease, border-color .28s ease, color .28s ease !important}
::selection{background:rgba(139,140,249,.30)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
button,input,select{font-family:inherit}
button,input,select,.card,.scene-item,.pill,.gate-row,.kcard,.tl .node{transition:background-color .16s,border-color .16s,color .16s,transform .16s,box-shadow .16s}
button:active{transform:scale(.98)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}

/* ===== topbar ===== */
.topbar{height:48px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:40;background:var(--bg)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13.5px;letter-spacing:-0.01em}
.brand .mark{width:20px;height:20px;border-radius:6px;background:var(--acc);display:grid;place-items:center}
.brand .mark svg{width:12px;height:12px;stroke:var(--acc-txt)}
.brand small{color:var(--t3);font-weight:400;font-size:12px}
.search{margin-left:auto;width:260px}
.search .fake{display:flex;align-items:center;gap:8px;height:30px;border:1px solid var(--bd);border-radius:var(--r-m);
  padding:0 10px;color:var(--t3);background:var(--s1);cursor:pointer;transition:border-color .15s;font-size:12.5px}
.search .fake:hover{border-color:var(--bd2);color:var(--t2)}
.kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--bd2);border-radius:5px;padding:1px 6px;color:var(--t3)}
.lang{display:flex;border:1px solid var(--bd);border-radius:999px;padding:2px;background:var(--s1)}
.lang button{background:transparent;color:var(--t3);border:0;border-radius:999px;padding:2.5px 10px;font-size:11px;font-weight:600;cursor:pointer;box-shadow:none;filter:none}
.lang button:hover{transform:none;filter:none;color:var(--t1)}
.lang button.on{background:var(--acc);color:var(--acc-txt)}
.iconbtn{width:30px;height:30px;border-radius:var(--r-m);border:1px solid var(--bd);background:var(--s1);color:var(--t2);
  display:grid;place-items:center;cursor:pointer;padding:0}
.iconbtn:hover{color:var(--t1);border-color:var(--bd2);background:var(--s2)}
.iconbtn svg{width:15px;height:15px;stroke-width:1.75;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.live{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--ok)}
.live .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}

/* ===== shell ===== */
.shell{flex:1;display:flex;min-height:0}
.rail{width:52px;padding:10px 8px;display:flex;flex-direction:column;gap:2px;align-items:center;
  border-right:1px solid var(--bd);position:sticky;top:48px;height:calc(100vh - 48px)}
.rail a{position:relative;width:36px;height:34px;border-radius:var(--r-m);display:grid;place-items:center;
  color:var(--t3);cursor:pointer}
.rail a svg{width:17px;height:17px;stroke-width:1.75;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.rail a:hover{background:var(--s2);color:var(--t1)}
.rail a.on{background:var(--acc-dim);color:var(--acc)}
.rail a.on::before{content:'';position:absolute;left:-8px;top:7px;bottom:7px;width:2px;border-radius:2px;background:var(--acc)}
.rail a .tip{position:absolute;left:50px;top:50%;transform:translateY(-50%) translateX(-4px);opacity:0;pointer-events:none;
  background:var(--s3);border:1px solid var(--bd2);border-radius:7px;padding:4px 10px;font-size:12px;white-space:nowrap;transition:opacity .12s,transform .12s;z-index:60;color:var(--t1)}
.rail a:hover .tip{opacity:1;transform:translateY(-50%) translateX(0)}
main{flex:1;padding:22px 28px 56px;max-width:1160px;min-width:0}

/* ===== primitives ===== */
h1{font-size:19px;font-weight:600;letter-spacing:-0.01em}
h1 .crumb{color:var(--t3);font-weight:400;font-size:13px;margin-left:2px}
.sub{color:var(--t2);font-size:12.5px;margin:5px 0 20px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r-l)}
.card.hover:hover{border-color:var(--bd2)}
.pad{padding:16px 18px}
.mono{font-family:var(--mono);font-size:11.5px}
.dim{color:var(--t2)} .dimmer{color:var(--t3)}
h2{font-size:13px;font-weight:600;margin-bottom:10px}
button{background:var(--acc);border:0;color:var(--acc-txt);border-radius:var(--r-m);padding:6px 13px;font-weight:600;cursor:pointer;font-size:12.5px}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--t2);border:1px solid var(--bd2);font-weight:500}
button.ghost:hover{color:var(--t1);border-color:rgba(140,140,160,.4);background:var(--s2)}
input,select{background:var(--s2);border:1px solid var(--bd);color:var(--t1);border-radius:var(--r-m);padding:6px 11px;font-size:12.5px;outline:none}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-dim)}
input::placeholder{color:var(--t3)}
.tag{display:inline-flex;align-items:center;border-radius:6px;padding:1.5px 8px;font-size:11px;font-weight:500;font-family:var(--mono)}
.t-acc{background:var(--acc-dim);color:var(--acc)} .t-ok{background:rgba(76,195,138,.13);color:var(--ok)}
.t-warn{background:rgba(226,185,59,.13);color:var(--warn)} .t-bad{background:rgba(229,105,122,.13);color:var(--bad)}
.t-cy{background:rgba(90,200,232,.13);color:var(--cy)} .t-dim{background:var(--s3);color:var(--t2)}
table{width:100%;border-collapse:collapse}
th{color:var(--t3);font-weight:500;font-size:11px;text-align:left;padding:8px 14px;border-bottom:1px solid var(--bd);letter-spacing:.05em;text-transform:uppercase}
td{padding:9px 14px;border-bottom:1px solid var(--bd);font-size:13px}
tr:last-child td{border-bottom:0}
tbody tr{cursor:default}
tbody tr:hover{background:var(--s2)}
.sect{display:none}
.sect.on{display:block;animation:pagein .26s cubic-bezier(.2,.8,.2,1)}
@keyframes pagein{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
#toast{position:fixed;bottom:20px;right:20px;background:var(--s3);border:1px solid var(--bd2);
  padding:11px 16px;border-radius:var(--r-m);display:none;z-index:99;box-shadow:var(--shadow);max-width:440px;font-size:12.5px;animation:pagein .22s cubic-bezier(.2,.8,.2,1)}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.bars .b{height:6px;border-radius:3px;background:var(--s3);overflow:hidden;margin:4px 0 9px}
.bars .b i{display:block;height:100%;border-radius:3px;background:var(--acc);width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}

/* ===== overview ===== */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}
.kpi{padding:13px 16px}
.kpi b{font-family:var(--mono);font-size:22px;font-weight:600;display:block;letter-spacing:-0.02em}
.kpi span{color:var(--t3);font-size:11.5px}

/* ===== scene gene ===== */
.cols{display:grid;grid-template-columns:225px 1fr 330px;gap:12px;align-items:start}
.scene-item{padding:8px 12px;border-radius:var(--r-m);cursor:pointer;border:1px solid transparent;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--t2)}
.scene-item:hover{background:var(--s2);color:var(--t1)}
.scene-item.on{background:var(--acc-dim);color:var(--t1);border-color:rgba(139,140,249,.35)}
.tl{position:relative;padding-left:22px;margin-top:10px}
.tl::before{content:'';position:absolute;left:6px;top:10px;bottom:10px;width:1px;background:var(--bd2)}
.tl .node{position:relative;margin:7px 0;padding:9px 13px;background:var(--s1);border:1px solid var(--bd);border-radius:var(--r-m);font-size:12.5px}
.tl .node:hover{border-color:var(--bd2)}
.tl .node::before{content:'';position:absolute;left:-19.5px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--acc)}
.kcard{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--r-m);background:var(--s1);border:1px solid var(--bd);margin:6px 0;font-size:12.5px}
.pillbar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.pill{cursor:pointer;border:1px solid var(--bd);border-radius:999px;padding:2.5px 11px;font-size:11.5px;color:var(--t2)}
.pill:hover{color:var(--t1);border-color:var(--bd2)}
.pill.on{color:var(--acc);border-color:var(--acc);background:var(--acc-dim)}

/* ===== stepper ===== */
.stepper{display:flex;align-items:center;margin:12px 0 18px;flex-wrap:wrap}
.step{display:flex;align-items:center}
.step .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;
  background:var(--s2);border:1px solid var(--bd2);color:var(--t3)}
.step .lab{margin:0 9px 0 7px;font-size:11px;color:var(--t3);font-family:var(--mono)}
.step.reached .dot{background:var(--acc);color:var(--acc-txt);border:0}
.step.reached .lab{color:var(--t1)}
.step .bar{width:26px;height:1px;background:var(--bd2);margin:0 2px}
.step.reached .bar{background:var(--acc)}

/* ===== drawer & palette ===== */
.drawer{position:fixed;top:0;right:-460px;width:430px;height:100vh;background:var(--s1);border-left:1px solid var(--bd2);
  z-index:80;transition:right .28s cubic-bezier(.2,.8,.2,1);padding:22px;overflow-y:auto}
.drawer.open{right:0;box-shadow:var(--shadow)}
.drawer h3{font-size:14px;font-weight:600;margin-bottom:12px}
.gate-row{display:flex;align-items:center;gap:10px;padding:7px 11px;border-radius:var(--r-m);margin:4px 0;background:var(--s2);font-size:12.5px}
.gate-row .ic{width:19px;height:19px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700}
.gate-row.pass .ic{background:rgba(76,195,138,.14);color:var(--ok)}
.gate-row.fail .ic{background:rgba(229,105,122,.14);color:var(--bad)}
.palette{position:fixed;inset:0;background:rgba(8,9,12,.45);backdrop-filter:blur(3px);z-index:90;display:none;justify-content:center;padding-top:11vh}
:root[data-theme="dark"] .palette{background:rgba(8,9,12,.55)}
.palette.open{display:flex}
.palette .box{width:560px;height:fit-content;background:var(--s1);border:1px solid var(--bd2);border-radius:14px;
  box-shadow:var(--shadow);overflow:hidden;animation:palin .16s cubic-bezier(.2,.8,.2,1)}
@keyframes palin{from{opacity:0;transform:scale(.985) translateY(4px)}to{opacity:1;transform:none}}
.palette input{width:100%;border:0;border-bottom:1px solid var(--bd);border-radius:0;background:transparent;padding:15px 18px;font-size:14px}
.palette .res{max-height:44vh;overflow-y:auto;padding:6px}
.palette .it{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--r-m);cursor:pointer;font-size:13px;color:var(--t2)}
.palette .it.sel,.palette .it:hover{background:var(--s2);color:var(--t1)}
.skel{border-radius:var(--r-m);background:linear-gradient(90deg,var(--s1) 25%,var(--s2) 50%,var(--s1) 75%);
  background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
@media(max-width:1080px){.cols{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-dash" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></symbol>

  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 4c0 5.3 14 5.3 14 16"/><path d="M19 4c0 5.3-14 5.3-14 16"/></symbol>

  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
</svg>

<div class="topbar">
  <div class="brand"><div class="mark"><svg><use href="#i-logo"/></svg></div>Novel Genome <small data-i18n="brand.sub">· 小说基因组</small></div>
  <div class="search" onclick="openPalette()"><div class="fake"><svg style="width:13px;height:13px;fill:none;stroke:currentColor;stroke-linecap:round"><use href="#i-search"/></svg> <span data-i18n="search.ph">快速跳转…</span> <span class="kbd" style="margin-left:auto">Ctrl K</span></div></div>
  <div class="lang" id="lang-sw">
    <button data-l="zh">中</button><button data-l="en">EN</button><button data-l="ja">日</button>
  </div>
  <button class="iconbtn" id="theme-btn" onclick="toggleTheme()" title="theme"><svg id="theme-ic"><use href="#i-sun"/></svg></button>
  <div class="live"><span class="dot"></span><span data-i18n="misc.live">在线</span></div>
</div>
<div class="shell">
  <div class="rail" id="rail">
    <a data-s="ov" class="on"><svg><use href="#i-dash"/></svg><span class="tip" data-i18n="nav.ov"></span></a>
    <a data-s="lib"><svg><use href="#i-book"/></svg><span class="tip" data-i18n="nav.lib"></span></a>
    <a data-s="sc"><svg><use href="#i-dna"/></svg><span class="tip" data-i18n="nav.sc"></span></a>
    <a data-s="kn"><svg><use href="#i-shield"/></svg><span class="tip" data-i18n="nav.kn"></span></a>
    <a data-s="re"><svg><use href="#i-flask"/></svg><span class="tip" data-i18n="nav.re"></span></a>
    <a data-s="rd"><svg><use href="#i-user"/></svg><span class="tip" data-i18n="nav.rd"></span></a>
    <a data-s="nf"><svg><use href="#i-tool"/></svg><span class="tip" data-i18n="nav.nf"></span></a>
    <a data-s="sy"><svg><use href="#i-gear"/></svg><span class="tip" data-i18n="nav.sy"></span></a>
  </div>
  <main>
    <section class="sect on" id="s-ov">
      <h1><span data-i18n="nav.ov"></span> <span class="crumb">/ Overview</span></h1>
      <div class="sub" data-i18n="sub.ov"></div>
      <div class="kpis" id="ov-kpis"></div>
      <div class="card pad" style="margin-top:2px">
        <h2 data-i18n="ov.quick"></h2>
        <div style="margin:4px 0 12px" data-i18n-html="ov.heroText"></div>
        <div class="row">
          <button onclick="gotoBook()" data-i18n="ov.openGene"></button>
          <button class="ghost" onclick="nav('lib')" data-i18n="ov.ingestNew"></button>
        </div>
      </div>
    </section>
    <section class="sect" id="s-lib">
      <h1><span data-i18n="nav.lib"></span> <span class="crumb">/ Corpus</span></h1>
      <div class="sub" data-i18n="sub.lib"></div>
      <div class="card pad" style="margin-bottom:12px">
        <div class="row">
          <input type="file" id="ing-file" style="padding:6px">
          <input id="ing-title" data-i18n-ph="ph.bookTitle" style="width:200px">
          <button onclick="ingest()" data-i18n="btn.ingest"></button><span id="ing-msg" class="dim"></span>

}
async function addHypothesis() {
  await post('/api/v1/hypotheses', { statement: $('#hy-stmt').value || '—', falsification_condition: $('#hy-fals').value || 'treatment not stably better than control' });
  toast('✅ ' + t('toast.hypOk')); loadHypotheses();
}
async function designExp(hid) {
  const exp = await post(`/api/v1/hypotheses/${hid}/design-experiment`, {
    fixed: { note: 'dashboard' }, measurements: ['curiosity', 'tension'],
    variants: [{ label: 'control', variant_type: 'control', changed: {} },
               { label: 'treatment_A', variant_type: 'treatment', changed: { stakes_change: { level: 'high' } } }] });
  const run = await api(`/api/v1/experiments/${exp.id}/run`, { method: 'POST' });
  $('#re-exp').innerHTML = `<div class="card pad"><h2>${exp.id}</h2>
    <div class="row" style="margin:8px 0">
      <span class="tag ${run.decision === 'inconclusive' ? 't-warn' : run.decision === 'supported' ? 't-ok' : 't-bad'}">${esc(d('decision', run.decision))}</span>
      <span class="tag t-dim">${esc(d('hyp', run.hypothesis_status))}</span>
      <span class="dim">${run.pairs} ${t('misc.pairs')}</span></div>
    <div class="dim" style="font-size:12px">${esc(run.reason)}</div></div>`;
}

/* ================= reader / arena ================= */
async function loadReader() {
  const ps = await api('/api/v1/reader-profiles');
  $('#rd-profile').innerHTML = ps.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('') || `<option value="">${t('opt.noProfile')}</option>`;
}
async function readerSim() {
  const body = {};
  if ($('#rd-scene').value.trim()) body.scene_id = $('#rd-scene').value.trim(); else body.text = $('#rd-text').value;
  if ($('#rd-profile').value) body.reader_profile_id = $('#rd-profile').value;
  try { const r = await post('/api/v1/eval/reader-sim', body);
    $('#rd-out').innerHTML = Object.entries(r.metrics).map(([k, v]) =>
      `<div class="row" style="display:flex;align-items:center;gap:10px;margin:4px 0"><span class="dim" style="width:190px;font-size:11.5px">${esc(d('metric', k))}</span>
       <div class="bars" style="flex:1"><div class="b" style="margin:0"><i data-w="${v * 100}"></i></div></div>
       <span class="mono dim" style="width:36px;text-align:right">${v}</span></div>`).join('');
    requestAnimationFrame(() => $$('#rd-out .b i').forEach(b => b.style.width = b.dataset.w + '%'));
  } catch (e) { toast(esc(e.message), true); }
}
async function arenaRun() {
  try { const r = await post('/api/v1/arena/run', { candidates: [
      { label: 'A', text: $('#ar-a').value || 'A' }, { label: 'B', text: $('#ar-b').value || 'B' }] });
    $('#ar-out').innerHTML = `<div class="row" style="margin-top:8px">
      <span class="tag t-acc">${t('misc.winner')}: ${esc(r.ranking ? r.ranking[0] : '?')}</span>
      <span class="tag t-dim">${r.pairs} ${t('misc.pairs')} · ${r.ties} ${t('misc.ties')}</span></div>`;
  } catch (e) { toast(esc(e.message), true); }
}

/* ================= novelforge ================= */
async function nfAdvice() {
  try { const r = await post('/api/v1/novelforge/scene-advice', { scene_goal: $('#nf-goal').value || '' });
    const flagged = (r.risk_flags || []).includes('no_validated_knowledge_yet');
    $('#nf-out').innerHTML = `<div class="card pad">
      <div class="row" style="margin-bottom:8px">
        <span class="tag ${flagged ? 't-warn' : 't-ok'}">${flagged ? t('gate.blocked') : t('gate.ok')}</span>
        ${r.knowledge_tier ? `<span class="tag t-acc">tier ${esc(r.knowledge_tier)}</span>` : ''}</div>
      ${flagged ? `<div class="dim" style="font-size:12px;margin-bottom:8px">${t('nf.blockedHint')}</div>` : ''}
      <pre class="mono dim" style="white-space:pre-wrap">${esc(JSON.stringify(r, null, 2))}</pre></div>`;
  } catch (e) { toast(esc(e.message), true); }
}

/* ================= system ================= */
async function loadSys() {
  const h = await api('/health');
  $('#sy-health').innerHTML = `<pre class="mono dim">${esc(JSON.stringify(h, null, 2))}</pre>
    <div class="dimmer" style="margin-top:6px">API /docs</div>`;
}
async function exportObsidian() {
  try { const r = await api('/api/v1/export/obsidian', { method: 'POST' });
    $('#sy-obs').textContent = `✅ ${r.files.length} ${t('toast.exported')} ${r.directory}`; }
  catch (e) { toast(esc(e.message), true); }
}

applyThemeIcon();
applyI18n();
loadOverview();
</script>
</body>
</html>
